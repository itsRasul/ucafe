services:
  api:
    build:
      target: development

    environment:
      NODE_ENV: development

    ports:
      - "127.0.0.1:${API_HOST_PORT:-3001}:3001"

    volumes:
      - .:/ucafe
      - api-node-modules:/ucafe/node_modules
      - api-workspace-node-modules:/ucafe/apps/api/node_modules


  web:
    build:
      target: development

    environment:
      NODE_ENV: development

    ports:
      - "127.0.0.1:${WEB_HOST_PORT:-3000}:3000"

    volumes:
      - .:/ucafe
      - web-node-modules:/ucafe/node_modules
      - web-next:/ucafe/apps/web/.next


  postgres:
    ports:
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5432}:5432"


  redis:
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6379}:6379"


  minio:
    ports:
      - "127.0.0.1:${MINIO_HOST_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_HOST_PORT:-9001}:9001"


volumes:
  api-node-modules:
  api-workspace-node-modules:
  web-node-modules:
  web-next: