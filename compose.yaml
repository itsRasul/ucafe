name: ucafe

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: node:22-alpine

    environment:
      NODE_ENV: development
      API_PORT: 3001

      PLATFORM_NAME: ucafe
      PLATFORM_NAME_FA: یو کافه
      PLATFORM_BASE_DOMAIN: u-cafe.localhost

      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      AUTH_PEPPER: ${AUTH_PEPPER}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}

      ACCESS_TOKEN_TTL_SECONDS: 600
      REFRESH_TOKEN_TTL_DAYS: 30

      OTP_TTL_SECONDS: 120
      OTP_RESEND_COOLDOWN_SECONDS: 60
      OTP_MAX_ATTEMPTS: 5
      OTP_PHONE_HOURLY_LIMIT: 5
      OTP_IP_HOURLY_LIMIT: 20

      TRUST_PROXY_HOPS: 1

      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}

      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: redis://redis:6379

      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: ucafe-media
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      SMS_PROVIDER: development
      KAVENEGAR_OTP_TEMPLATE: ucafe-otp
      KAVENEGAR_RESERVATION_CONFIRMED_TEMPLATE: ucafe-reservation-confirmed

      PAYMENT_PROVIDER: simulated
      PAYMENT_CALLBACK_BASE_URL: http://localhost:3001

    ports:
      - "127.0.0.1:3001:3001"

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: node:22-alpine

    environment:
      NODE_ENV: development
      PORT: 3000

      API_INTERNAL_URL: http://api:3001/api/v1
      PLATFORM_BASE_DOMAIN: u-cafe.localhost
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}

    ports:
      - "127.0.0.1:3000:3000"

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ucafe -d ucafe"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  postgres-data:
  redis-data:
  minio-data:
