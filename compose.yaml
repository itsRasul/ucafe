name: ucafe

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: node:22-bookworm-slim

    environment:
      API_PORT: 3001

      PLATFORM_NAME: ${PLATFORM_NAME}
      PLATFORM_NAME_FA: ${PLATFORM_NAME_FA}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN}

      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      AUTH_PEPPER: ${AUTH_PEPPER}
      PII_ENCRYPTION_KEY: ${PII_ENCRYPTION_KEY}

      ACCESS_TOKEN_TTL_SECONDS: ${ACCESS_TOKEN_TTL_SECONDS}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS}

      OTP_TTL_SECONDS: ${OTP_TTL_SECONDS}
      OTP_RESEND_COOLDOWN_SECONDS: ${OTP_RESEND_COOLDOWN_SECONDS}
      OTP_MAX_ATTEMPTS: ${OTP_MAX_ATTEMPTS}
      OTP_PHONE_HOURLY_LIMIT: ${OTP_PHONE_HOURLY_LIMIT}
      OTP_IP_HOURLY_LIMIT: ${OTP_IP_HOURLY_LIMIT}

      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS}

      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}

      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}

      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_REGION: ${S3_REGION}
      S3_BUCKET: ${S3_BUCKET}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}

      SMS_PROVIDER: ${SMS_PROVIDER}

      KAVENEGAR_API_KEY: ${KAVENEGAR_API_KEY}
      KAVENEGAR_OTP_TEMPLATE: ${KAVENEGAR_OTP_TEMPLATE}
      KAVENEGAR_RESERVATION_CONFIRMED_TEMPLATE: ${KAVENEGAR_RESERVATION_CONFIRMED_TEMPLATE}

      ZARINPAL_MERCHANT_ID: ${ZARINPAL_MERCHANT_ID}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER}
      PAYMENT_CALLBACK_BASE_URL: ${PAYMENT_CALLBACK_BASE_URL}

    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

    restart: unless-stopped


  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: node:22-bookworm-slim

    environment:
      PORT: 3000

      API_INTERNAL_URL: ${API_INTERNAL_URL}
      PLATFORM_BASE_DOMAIN: ${PLATFORM_BASE_DOMAIN}
      INTERNAL_PROXY_SECRET: ${INTERNAL_PROXY_SECRET}

    depends_on:
      api:
        condition: service_started

    restart: unless-stopped


  postgres:
    image: postgres:17-alpine

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - postgres-data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  redis:
    image: redis:7-alpine

    volumes:
      - redis-data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z-cpuv1

    command: server /data --console-address ":9001"

    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}

    volumes:
      - minio-data:/data

    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

    restart: unless-stopped


volumes:
  postgres-data:
  redis-data:
  minio-data: