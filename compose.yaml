name: cafexa

services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      args:
        NODE_IMAGE: backend-app:latest
    environment:
      NODE_ENV: development
      API_PORT: 3001
      PLATFORM_NAME: Cafexa
      PLATFORM_NAME_FA: کافکسا
      PLATFORM_BASE_DOMAIN: cafexa.localhost
      ACCESS_TOKEN_SECRET: development-only-access-secret-change-before-production
      AUTH_PEPPER: development-only-auth-pepper-change-before-production
      PII_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      ACCESS_TOKEN_TTL_SECONDS: 600
      REFRESH_TOKEN_TTL_DAYS: 30
      OTP_TTL_SECONDS: 120
      OTP_RESEND_COOLDOWN_SECONDS: 60
      OTP_MAX_ATTEMPTS: 5
      OTP_PHONE_HOURLY_LIMIT: 5
      OTP_IP_HOURLY_LIMIT: 20
      TRUST_PROXY_HOPS: 0
      INTERNAL_PROXY_SECRET: development-only-internal-proxy-secret-change-me
      DATABASE_URL: postgresql://cafexa:cafexa@postgres:5432/cafexa
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_REGION: us-east-1
      S3_BUCKET: cafexa-media
      S3_ACCESS_KEY: cafexa
      S3_SECRET_KEY: change-me-in-local-env
      SMS_PROVIDER: development
      KAVENEGAR_OTP_TEMPLATE: cafexa-otp
      KAVENEGAR_RESERVATION_CONFIRMED_TEMPLATE: cafexa-reservation-confirmed
      PAYMENT_PROVIDER: simulated
      PAYMENT_CALLBACK_BASE_URL: http://localhost:3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NODE_IMAGE: backend-app:latest
    environment:
      NODE_ENV: production
      PORT: 3000
      API_INTERNAL_URL: http://api:3001/api/v1
      PLATFORM_BASE_DOMAIN: cafexa.localhost
      INTERNAL_PROXY_SECRET: development-only-internal-proxy-secret-change-me
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cafexa
      POSTGRES_USER: cafexa
      POSTGRES_PASSWORD: cafexa
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cafexa -d cafexa"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: cafexa
      MINIO_ROOT_PASSWORD: change-me-in-local-env
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
  redis-data:
  minio-data:
